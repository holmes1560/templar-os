allowBuilds:
  '@prisma/client': set this to true or false
  '@prisma/engines': set this to true or false
  esbuild: set this to true or false
  prisma: set this to true or false
  unrs-resolver: set this to true or false
# Prisma's postinstall fetches query engines and generates the client.
# Without this, pnpm blocks the build script and @prisma/client is never generated.
onlyBuiltDependencies:
  - prisma
  - '@prisma/client'
  - '@prisma/engines'
